prefix: "&x&0&0&D&6&F&FChat &7▶&r&f "

msg-system:
  enabled: true

chat:
  enabled: true
  format: "%luckperms_prefix%%customname_name%%luckperms_suffix% &7▶ &f%message%"
  hover:
    enabled: true
    chat-format: "%customname_name% &7▶ &f%message%"
    hover-lore:
      - "&r%customname_name%&r"
      - "&r"
      - "&#FC0000\uD83D\uDDE1 &fᴋɪʟʟs &#FC0000%statistic_player_kills%      "
      - "&#F97603☠ &fᴅᴇᴀᴛʜs &#F97603%statistic_deaths%   "
      - "&#FCE300⌚ &fᴘʟᴀʏᴛɪᴍᴇ &#FCE300%statistic_time_played:days%d %statistic_time_played:hours%h"
      - "&r"
      - "&r&7ᴄʟɪᴄᴋᴇ ᴜᴍ ᴇɪɴᴇ ᴛᴘᴀ ᴢᴜ sᴇɴᴅᴇɴ&r"
    click:
      enabled: true
      action: "RUN_COMMAND"
      value: "tpa %player%"

anti-spam:
  cooldown-seconds: 3
  block-repeated-messages: true
  repeat-window-seconds: 30
  max-same-message: 2
  bypass-permission: "zmsg.repeat.bypass"
  message-on-cooldown: "{prefix} &cBitte warte &f{seconds}s &cbis zur naechsten Nachricht."
  message-on-repeat: "{prefix} &cBitte sende nicht immer die gleiche Nachricht."

delivery:
  chat: true
  actionbar: true
  title: false

messages:
  sender: "{prefix} &7Du -> &f{receiver}&7: &f{message}"
  receiver: "{prefix} &f{sender} &7-> Du: &f{message}"
  sender-actionbar: "{prefix} &7Du -> &f{receiver}&7: &f{message}"
  actionbar: "{prefix} &f{sender}&7: &f{message}"
  title: "{prefix}"
  subtitle: "&f{sender}&7: &f{message}"
  spy: "{prefix} &8[Spy] &f{sender} &7-> &f{receiver}&7: &f{message}"
  alerts-on: "{prefix} &aMsgAlerts aktiviert."
  alerts-off: "{prefix} &cMsgAlerts deaktiviert."
  blocked: "{prefix} &cDeine Nachricht wurden blockiert weil sie Wörter/Sätze beinhalten die nicht erlaubt sind."
  chat-toggle-on: "{prefix} &aChat aktiviert."
  chat-toggle-off: "{prefix} &cChat deaktiviert."
  msg-toggle-on: "{prefix} &aMSG aktiviert."
  msg-toggle-off: "{prefix} &cMSG deaktiviert."
  msg-disabled: "{prefix} &cDieser Spieler hat MSG deaktiviert."
  msg-system-disabled: "{prefix} &cDas MSG-System ist deaktiviert."
  self-msg: "{prefix} &x&F&F&0&0&0&0ᴅᴜ ᴋᴀɴɴsᴛ ᴅɪᴄʜ sᴇʟʙᴇʀ ɴɪᴄʜᴛ ᴍsɢ´ɴ"
  player-not-found: "{prefix} &cSpieler nicht gefunden."
  msg-usage: "{prefix} &cBenutzung: /msg <spieler> <nachricht>"
  zmsg-usage: "{prefix} &cBenutzung: /zmsg reload"
  broadcast-usage: "{prefix} &cBenutzung: /zbrodcast <nachricht>"
  reload: "{prefix} &aConfig neu geladen."
  no-permission: "{prefix} &cKeine Berechtigung."
  blocked-notify: "{prefix} &8[&#FF0000Filter&8] &f{sender} &fhat eine blockierte Nachricht geschrieben: &#FF0000{message}"
  staffchat-on: "{prefix} &aStaffChat aktiviert."
  staffchat-off: "{prefix} &cStaffChat deaktiviert."
  staffchat-format: "{prefix} &c[STAFF] &f{sender}&7: &f{message}"

blocked-notify-permission: "zmsg.filter.notify"

sounds:
  msg:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0
  mention:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2

mention:
  enabled: true
  highlight: "&e&l"

blocked-words:
  - "Hurensohn"
  - "Scheiße"
  - "Fotze"
  - "Fick"
  - "nigger"
  - "Bastadt"

blocked-phrases:
  - "nigger"
  - "anderer satz"

reminder:
  discord:
    timer: 10m
    message:
      - "&x&C&0&C&8&F&F★&x&B&8&B&E&F&F &x&B&0&B&4&F&FJ&x&A&8&A&A&F&Fo&x&A&1&A&0&F&Fi&x&9&9&9&6&F&Fn&x&9&1&8&C&F&Fe&x&8&9&8&2&F&F &x&8&1&7&8&F&Fd&x&7&9&6&E&F&Fe&x&7&2&6&4&F&Fn&x&6&A&5&A&F&F &x&6&2&5&0&F&FD&x&5&A&4&6&F&Fi&x&5&2&3&C&F&Fs&x&4&A&3&2&F&Fc&x&4&2&2&8&F&Fo&x&3&B&1&E&F&Fr&x&3&3&1&4&F&Fd&x&2&B&0&A&F&F &x&2&3&0&0&F&F★"
      - ""
      - "Bleibe up to date um keine Events"
      - "Giveaways oder Neugigkeiten zu verpassen"
      - ""
      - "&x&C&0&C&8&F&F▶&x&B&B&C&2&F&F︎&x&B&7&B&C&F&F &x&B&2&B&6&F&Fh&x&A&E&B&0&F&Ft&x&A&9&A&B&F&Ft&x&A&4&A&5&F&Fp&x&A&0&9&F&F&Fs&x&9&B&9&9&F&F:&x&9&6&9&3&F&F/&x&9&2&8&D&F&F/&x&8&D&8&7&F&Fd&x&8&9&8&1&F&Fi&x&8&4&7&C&F&Fs&x&7&F&7&6&F&Fc&x&7&B&7&0&F&Fo&x&7&6&6&A&F&Fr&x&7&2&6&4&F&Fd&x&6&D&5&E&F&F.&x&6&8&5&8&F&Fg&x&6&4&5&2&F&Fg&x&5&F&4&C&F&F/&x&5&A&4&7&F&FP&x&5&6&4&1&F&Fd&x&5&1&3&B&F&Fh&x&4&D&3&5&F&Fa&x&4&8&2&F&F&Fm&x&4&3&2&9&F&Fx&x&3&F&2&3&F&Fb&x&3&A&1&D&F&FE&x&3&5&1&8&F&Fj&x&3&1&1&2&F&Ff&x&2&C&0&C&F&F &x&2&8&0&6&F&F◀&x&2&3&0&0&F&F︎"

alerts:
  enabled-by-default: false

titles:
  fade-in: 10
  stay: 40
  fade-out: 10